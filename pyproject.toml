[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conforma"
version = "0.1.0"
description = "A delivery-spec compliance agent for post-production media, built on replykit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edgar Hernandez", email = "edgarhernandez00@gmail.com" }]
keywords = [
    "ffmpeg",
    "ffprobe",
    "mediainfo",
    "delivery-spec",
    "conformance",
    "post-production",
    "netflix",
    "ebu",
    "agent",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "replykit>=0.1.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    # Sequence-level conformance: parse exported timelines (otio_json always;
    # FCPXML/AAF via the optional adapter plugins below) into an OTIO Timeline.
    "opentimelineio>=0.17,<1.0",
]

[project.urls]
Homepage = "https://github.com/eggy-sh/conforma"
Repository = "https://github.com/eggy-sh/conforma"

[project.scripts]
conforma = "conforma.cli:main"

[project.optional-dependencies]
# FCPXML and AAF are *not* bundled with opentimelineio; they ship as separate
# adapter plugins. The core sequence path works with otio_json out of the box;
# install this extra to read/write .fcpxml and .aaf exports.
adapters = [
    "otio-fcpx-xml-adapter>=1.0",
    "otio-aaf-adapter>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # The dev/test matrix installs the adapters so the .fcpxml interop test runs.
    "otio-fcpx-xml-adapter>=1.0",
    "otio-aaf-adapter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conforma"]

[tool.hatch.build.targets.wheel.force-include]
"src/conforma/presets" = "conforma/presets"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern *requires* calling typer.Option/Argument in
# parameter defaults; B008 ("function call in default argument") is a false
# positive for this idiom.
"src/conforma/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["conforma"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
