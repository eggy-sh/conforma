# Netflix-style HD ProRes delivery spec (approximation, not an official document).
# Models a typical "HD 1080p ProRes 422 HQ, 23.976p, 10-bit, 48 kHz PCM" mezzanine
# requirement. Values are illustrative for the conforma demo/test suite and must
# not be treated as Netflix's authoritative Delivery Specifications.
name: "Netflix HD ProRes (approx.)"
version: "1.0"
description: >
  Approximation of a Netflix-style HD ProRes 422 HQ video mezzanine: 1080p,
  23.976 fps progressive, 10-bit, in a QuickTime (.mov) wrapper with 48 kHz
  PCM audio. Illustrative only.
requirements:
  - key: container
    expected: mov
    description: "QuickTime (.mov) wrapper"
  - key: resolution
    expected: [1920, 1080]
    description: "1920x1080 (Full HD)"
  - key: frame_rate
    expected: 23.976
    tolerance: 0.01
    description: "23.976 fps"
  - key: scan_type
    expected: progressive
    description: "Progressive scan"
  - key: video_codec
    expected: prores
    description: "Apple ProRes (422 HQ family)"
  - key: bit_depth
    expected: 10
    description: "10-bit video"
  - key: audio_codec
    expected: pcm
    description: "Uncompressed PCM audio"
  - key: audio_channels
    expected: 2
    description: "2.0 stereo (per pair)"
  - key: audio_sample_rate
    expected: 48000
    description: "48 kHz audio"
