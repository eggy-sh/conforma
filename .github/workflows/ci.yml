name: CI

# Lint + hermetic test suite for conforma. Everything here is offline: the suite
# never touches ffmpeg, ffprobe, an NLE, a real LLM, or the network (replykit's
# MockModel / ScriptedModel stand in for any model; committed *.json probes and
# *.otio/*.fcpxml timelines stand in for any media). The only network access is
# dependency installation. The dev extra pulls the optional OpenTimelineIO
# FCPXML/AAF adapters so the sequence-conformance .fcpxml interop path is covered.
#
# conforma depends on replykit, which is not yet published to PyPI. CI installs it
# straight from git (the main branch of the sibling repo); local/dev uses an
# editable install of the sibling checkout instead. Keep these in sync.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a busy PR doesn't queue stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out conforma
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # conforma depends on replykit, which is not yet published to PyPI. Install it
      # straight from the sibling repo's main branch on GitHub so CI exercises the
      # same public contract the tests rely on locally (where replykit is an editable
      # sibling install). Install replykit first so the conforma install below
      # resolves the `replykit>=0.1.0` dependency against this build, not a
      # (non-existent) package-index release.
      - name: Create venv and install conforma + replykit
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install 'replykit @ git+https://github.com/eggy-sh/replykit@main'
          uv pip install -e '.[dev]'

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest with coverage
        run: uv run pytest --cov=conforma --cov-report=term-missing

      # A fast end-to-end smoke check of the sequence subcommand on the shipped
      # example timelines: the conforming cut exits 0, the non-conforming cut
      # exits 1 — the same stable contract a delivery gate relies on.
      - name: Sequence CLI smoke (exit-code contract)
        run: |
          uv run conforma sequence examples/seq_netflix_pass.otio --spec netflix-imf --json
          if uv run conforma sequence examples/seq_netflix_fail.otio --spec netflix-imf --json; then
            echo "::error::expected the non-conforming sequence to exit 1"
            exit 1
          fi
